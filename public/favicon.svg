<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Arrière-plan sombre avec coins arrondis -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  
  <!-- Cercle d'accentuation / Aura -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ec663b" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Structure entrelacée A + M (ALODO MPME) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lettre A (ALODO) -->
    <path d="M160 360 L256 140 L352 360" stroke="#ec663b" stroke-width="36"/>
    <path d="M200 280 L312 280" stroke="#ec663b" stroke-width="30"/>
    
    <!-- Lettre M (MPME) intégrée au centre -->
    <path d="M170 360 L170 230 L256 310 L342 230 L342 360" stroke="#ffffff" stroke-width="26"/>
  </g>
  
  <!-- Points d'accentuation Orange -->
  <circle cx="256" cy="140" r="14" fill="#ec663b"/>
</svg>
